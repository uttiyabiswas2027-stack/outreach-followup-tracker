name: daily-followups
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
jobs:
  followups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python tracker.py data/sample_outreach.csv "$(date +%F)" >> "$GITHUB_STEP_SUMMARY"
